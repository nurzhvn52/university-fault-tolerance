# Fault-tolerant gateway.
# HTTP: two replicas per service on different nodes, active health checks every second
# (a server is DOWN after 2 failed checks and UP again after 2 good ones), connections to a
# server marked DOWN are closed, and failed requests are retried once on the other replica.
# Only requests that are safe to repeat are retried: idempotent methods and requests with an
# Idempotency-Key header.
# PostgreSQL: TCP routing to the current primary, found through the Patroni REST API.

global
    log stdout format raw local0
    maxconn 8192

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    hold nx 1s

defaults
    mode http
    log global
    option httplog
    option dontlog-normal
    timeout connect 1s
    timeout client 30s
    timeout server 5s
    retries 2
    option redispatch 1
    retry-on conn-failure empty-response 503
    default-server inter 1s fastinter 500ms downinter 1s fall 2 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker

frontend api
    bind :8080
    acl safe_to_retry method GET HEAD OPTIONS PUT DELETE
    acl has_idempotency_key req.hdr(Idempotency-Key) -m found
    http-request disable-l7-retry unless safe_to_retry or has_idempotency_key
    acl to_student path_beg /api/students /api/courses /api/sections /api/registrations
    acl to_payment path_beg /api/tuition /api/payments
    acl to_records path_beg /api/grades /api/transcripts
    acl to_timetable path_beg /api/timetable
    use_backend student if to_student
    use_backend payment if to_payment
    use_backend records if to_records
    use_backend timetable if to_timetable
    default_backend no_route

backend student
    option httpchk GET /health/ready
    http-check expect status 200
    server student-1 student-1:8000 check
    server student-2 student-2:8000 check

backend payment
    option httpchk GET /health/ready
    http-check expect status 200
    server payment-1 payment-1:8000 check
    server payment-2 payment-2:8000 check

backend records
    option httpchk GET /health/ready
    http-check expect status 200
    server records-1 records-1:8000 check
    server records-2 records-2:8000 check

backend timetable
    option httpchk GET /health/ready
    http-check expect status 200
    server timetable-1 timetable-1:8000 check
    server timetable-2 timetable-2:8000 check

backend no_route
    http-request return status 404 content-type application/json string '{"error":"no_route"}'

listen postgres
    bind :5432
    mode tcp
    option tcplog
    timeout client 30m
    timeout server 30m
    # Only the Patroni leader answers 200 on /primary.
    option httpchk GET /primary
    http-check expect status 200
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s

frontend prometheus
    bind :8405
    http-request use-service prometheus-exporter if { path /metrics }
