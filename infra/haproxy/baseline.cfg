# Baseline gateway: path routing to a single instance of each service.
# No health checks, no retries, no redispatch and very long timeouts, i.e. no
# fault-tolerance policy. The DNS resolver only keeps addresses current if a
# container is restarted by hand.

global
    log stdout format raw local0
    maxconn 4096

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode http
    log global
    option httplog
    option dontlog-normal
    retries 0
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    default-server init-addr last,libc,none resolvers docker

frontend api
    bind :8080
    acl to_student path_beg /api/students /api/courses /api/sections /api/registrations
    acl to_payment path_beg /api/tuition /api/payments
    acl to_records path_beg /api/grades /api/transcripts
    acl to_timetable path_beg /api/timetable
    use_backend student if to_student
    use_backend payment if to_payment
    use_backend records if to_records
    use_backend timetable if to_timetable
    default_backend no_route

backend student
    server student-1 student-1:8000

backend payment
    server payment-1 payment-1:8000

backend records
    server records-1 records-1:8000

backend timetable
    server timetable-1 timetable-1:8000

backend no_route
    http-request return status 404 content-type application/json string '{"error":"no_route"}'

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
