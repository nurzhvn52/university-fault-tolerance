# Endterm gateway: the fault-tolerant gateway plus request ids.
#
# Fault-tolerant gateway.
# HTTP: two replicas per service on different nodes, active health checks every second
# (a server is DOWN after 2 failed checks and UP again after 2 good ones), connections to a
# server marked DOWN are closed, and failed requests are retried once on the other replica.
# Only requests that are safe to repeat are retried: idempotent methods and requests with an
# Idempotency-Key header.
# PostgreSQL: TCP routing to the current primary, found through the Patroni REST API.

global
    log stdout format raw local0
    maxconn 8192

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    hold nx 1s

defaults
    mode http
    log global
    option httplog
    option dontlog-normal
    timeout connect 1s
    timeout client 30s
    # Slow-header (slowloris) protection: a request must arrive within 5 s.
    timeout http-request 5s
    timeout server 5s
    retries 2
    option redispatch 1
    retry-on conn-failure empty-response 503
    default-server inter 1s fastinter 500ms downinter 1s fall 2 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker

frontend api
    bind :8080
    # Request id: keep a well-formed id sent by the caller (service-to-service calls pass it
    # on), otherwise create one. Services put it into every log line.
    http-request set-var(txn.rid) req.hdr(X-Request-ID) if { req.hdr(X-Request-ID) -m reg '^[A-Za-z0-9._-]{8,64}$' }
    http-request set-var(txn.rid) uuid() unless { var(txn.rid) -m found }
    http-request set-header X-Request-ID %[var(txn.rid)]
    http-request capture var(txn.rid) len 64
    http-after-response set-header X-Request-ID %[var(txn.rid)] unless { res.hdr(X-Request-ID) -m found }
    # The source address is set here, never taken from the client: services use it to tell
    # who is behind a denied request.
    http-request set-header X-Forwarded-For %[src]
    # Internal and operator endpoints are never reachable through the gateway.
    http-request deny deny_status 404 if { path_beg /_chaos /metrics /health }
    # Oversized bodies are refused before they reach a service.
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 262144 }
    # Password guessing: at most 30 login attempts per 10 s from one address.
    acl is_login path_beg /api/auth/login
    http-request track-sc0 src table login_abuse if is_login
    http-request deny deny_status 429 content-type application/json string '{"detail":"too_many_logins"}' if is_login { sc_http_req_rate(0) gt 30 }
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header Cache-Control no-store
    acl safe_to_retry method GET HEAD OPTIONS PUT DELETE
    acl has_idempotency_key req.hdr(Idempotency-Key) -m found
    http-request disable-l7-retry unless safe_to_retry or has_idempotency_key
    acl to_student path_beg /api/students /api/courses /api/sections /api/registrations
    acl to_payment path_beg /api/tuition /api/payments
    acl to_records path_beg /api/grades /api/transcripts
    acl to_timetable path_beg /api/timetable
    acl to_auth path_beg /api/auth
    use_backend auth if to_auth
    use_backend student if to_student
    use_backend payment if to_payment
    use_backend records if to_records
    use_backend timetable if to_timetable
    default_backend no_route

backend login_abuse
    stick-table type ip size 100k expire 2m store http_req_rate(10s)

backend auth
    option httpchk GET /health/ready
    http-check expect status 200
    server auth-1 auth-1:8000 check
    server auth-2 auth-2:8000 check

backend student
    option httpchk GET /health/ready
    http-check expect status 200
    server student-1 student-1:8000 check
    server student-2 student-2:8000 check

backend payment
    option httpchk GET /health/ready
    http-check expect status 200
    server payment-1 payment-1:8000 check
    server payment-2 payment-2:8000 check

backend records
    option httpchk GET /health/ready
    http-check expect status 200
    server records-1 records-1:8000 check
    server records-2 records-2:8000 check

backend timetable
    option httpchk GET /health/ready
    http-check expect status 200
    server timetable-1 timetable-1:8000 check
    server timetable-2 timetable-2:8000 check

backend no_route
    http-request return status 404 content-type application/json string '{"error":"no_route"}'

listen postgres
    bind :5432
    mode tcp
    option tcplog
    timeout client 30m
    timeout server 30m
    # Only the Patroni leader answers 200 on /primary.
    option httpchk GET /primary
    http-check expect status 200
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s

frontend prometheus
    bind :8405
    http-request use-service prometheus-exporter if { path /metrics }
